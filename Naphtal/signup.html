<!DOCTYPE html> <!--Declaration of html document type-->
<html lang="en">  <!--Declaration of coding language.-->
<head>
  <meta charset="UTF-8">  <!--Declaration of charachter set-->
  <title>Sign Up - Richfield Connect</title>
  <link rel="stylesheet" href="JuniorCss.css">  <!--Reference of CSS file-->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!--Link to Jquery file-->
  <script src="Juniorsignup.js" defer></script> <!--Link to Javascript for sign up page-->
</head>
<body>
<header>
  <h1>Sign Up</h1>
  <div style="display: flex;">   <!--Displaying image and navigation side by side--> 
  <div><img src="ConnectLogo.jpg" alt="RichfielConnectLogo" height="200px" width="200px"></div>
  <div>
    <nav>
   <a href="Home.html">Home</a>        <!--HyperLink to Home page-->
    <a href="about.html">About</a>       <!--Hyperlink to about page-->
    <a href="signup.html">Sign Up</a>    <!--HyperLink to signup page-->
    <a href="profile.html">Profile</a>   <!--Hyperlink to profile page-->
    <a href="feed.html">Feed</a>        <!--Hyperlink to feed page.-->
  </nav>
  </div>
  </div>
</header>
<div class="container">  
  <h1>Create Your Account</h1>
  <!--Form creation with class container-->
  <form id="signupForm" class="Rform">
    <label>Full Name <input type="text" id="name"></label>
    <span class="error"></span>

    <label>Student Number <input type="text" id="studentNumber"></label>
    <span class="error"></span>

    <label>Campus/DL <input type="text" id="campus"></label>
    <span class="error"></span>

    <label>Email <input type="email" id="email"></label>
    <span class="error"></span>

    <label>Password (***Minimum 8 characters***) <input type="password" id="password"></label>
    <span class="error"></span>

    <label>Confirm Password <input type="password" id="confirmPassword"></label>
    <span class="error"></span>

    <label>Interests <input type="text" id="interests"></label>
    <span class="error"></span>

    <label>Short Bio <textarea id="bio"></textarea></label>
    <span class="error"></span>

    <button type="submit">Register</button>
  </form>
<!--Live Preview of form-->
  <div id="livePreview">
    <h2>Live Profile Preview</h2>
    <p><strong>Name:</strong> <span id="previewName"></span></p>
    <p><strong>Bio:</strong> <span id="previewBio"></span></p>
    <p><strong>Interests:</strong> <span id="previewInterests"></span></p>
  </div>
</div>
<footer>&copy 2026| Created by Ramawa Naphtal Junior</footer>
</body>
</html>
